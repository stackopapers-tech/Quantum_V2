<!DOCTYPE html>

<html>
<head>
    <title>QUANTUM RUN</title>
    <style>
        body { margin: 0; overflow: hidden; background: #05050a; font-family: 'Courier New', Courier, monospace; }
        canvas { display: block; filter: blur(0.4px) contrast(1.2); }
        #ui {
            position: absolute; top: 20px; left: 20px; color: #39ff14;
            text-shadow: 0 0 10px #39ff14; pointer-events: none;
        }
        .overlay {
            position: absolute; inset: 0; display: flex; flex-direction: column;
            align-items: center; justify-content: center;
            background: rgba(0,0,0,0.8); color: #39ff14; text-align: center;
        }
        .btn {
            padding: 15px 30px; background: transparent; border: 2px solid #39ff14;
            color: #39ff14; cursor: pointer; font-weight: bold; font-size: 1.2rem;
            transition: 0.3s; text-transform: uppercase; margin-top: 20px;
        }
        .btn:hover { background: #39ff14; color: #000; box-shadow: 0 0 20px #39ff14; }
        .hidden { display: none; }
    </style>
</head>
<body>
    <div id="ui">
        <div style="font-size: 24px; font-weight: bold;">QUANTUM_RUN v1.0</div>
        <div id="score">DIST: 0m</div>
    </div>

    <div id="start-screen" class="overlay">
        <h1 style="font-size: 3rem; margin-bottom: 0;">QUANTUM RUN</h1>
        <p>AVOID THE RED VOIDS. SURVIVE THE GRID.</p>
        <button class="btn" onclick="startGame()">INITIALIZE SYSTEM</button>
    </div>

    <div id="game-over" class="overlay hidden">
        <h1 style="font-size: 3rem; color: #ff4444;">SYSTEM CRASH</h1>
        <p id="final-score"></p>
        <button class="btn" onclick="location.reload()">REBOOT</button>
    </div>

    <canvas id="gameCanvas"></canvas>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const scoreEl = document.getElementById('score');

        let gameActive = false;
        let score = 0;
        let speed = 5;
        let obstacles = [];
        let player = { x: 50, y: 0, w: 30, h: 30, dy: 0, jump: -12, gravity: 0.6, grounded: false };

        function resize() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
            player.y = canvas.height - 100;
        }
        window.addEventListener('resize', resize);
        resize();

        function startGame() {
            document.getElementById('start-screen').classList.add('hidden');
            gameActive = true;
            animate();
        }

        window.addEventListener('keydown', (e) => {
            if (e.code === 'Space' || e.code === 'ArrowUp') {
                if (player.grounded) {
                    player.dy = player.jump;
                    player.grounded = false;
                }
            }
        });

        function spawnObstacle() {
            if (Math.random() < 0.02) {
                obstacles.push({
                    x: canvas.width,
                    y: canvas.height - 70,
                    w: 20 + Math.random() * 30,
                    h: 30 + Math.random() * 40,
                    color: '#ff4444'
                });
            }
        }

        function animate() {
            if (!gameActive) return;
            requestAnimationFrame(animate);
            ctx.fillStyle = '#05050a';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // Draw Grid Floor
            ctx.strokeStyle = '#1a1a3a';
            ctx.lineWidth = 2;
            for(let i=0; i<canvas.width; i+=50) {
                ctx.beginPath(); ctx.moveTo(i - (score % 50), 0); ctx.lineTo(i - (score % 50), canvas.height);
ctx.stroke();
            }
            ctx.beginPath(); ctx.moveTo(0, canvas.height - 40); ctx.lineTo(canvas.width, canvas.height - 40);
ctx.stroke();

            // Player Logic
            player.dy += player.gravity;
            player.y += player.dy;
            if (player.y > canvas.height - 70) {
                player.y = canvas.height - 70;
                player.dy = 0;
                player.grounded = true;
            }

            // Player Draw (Neon Cube)
            ctx.fillStyle = '#39ff14';
            ctx.shadowBlur = 15; ctx.shadowColor = '#39ff14';
            ctx.fillRect(player.x, player.y, player.w, player.h);
            ctx.shadowBlur = 0;

            // Obstacles
            spawnObstacle();
            obstacles.forEach((obs, i) => {
                obs.x -= speed;
                ctx.fillStyle = obs.color;
                ctx.shadowBlur = 10; ctx.shadowColor = obs.color;
                ctx.fillRect(obs.x, canvas.height - 40 - obs.h, obs.w, obs.h);
                ctx.shadowBlur = 0;

                // Collision
                if (player.x < obs.x + obs.w && player.x + player.w > obs.x &&
                    player.y < (canvas.height - 40) && player.y + player.h > (canvas.height - 40 - obs.h)) {
                    gameActive = false;
                    document.getElementById('game-over').classList.remove('hidden');
                    document.getElementById('final-score').textContent = `Distance Travelled: ${Math.floor(score)}m`;
                }
            });

            obstacles = obstacles.filter(obs => obs.x + obs.w > 0);
            score += 0.1;
            speed += 0.001;
            scoreEl.textContent = `DIST: ${Math.floor(score)}m`;
        }
    </script>
</body>
</html>
