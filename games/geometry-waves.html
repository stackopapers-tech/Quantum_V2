<script>
    const hideFullScreenButton = "";
    const buildUrl = "https://quantil.jsdelivr.net/gh/okyesgoogl/why@main/Build";
    const loaderUrl = buildUrl + "/76f034cff49013ce85bd6945ebf32347.loader.js";

    const wasmParts = [
        buildUrl + "/bfcb74df6ba4bd08a501593eb4da5cfa.wasm.br.part0",
        buildUrl + "/bfcb74df6ba4bd08a501593eb4da5cfa.wasm.br.part1",
        buildUrl + "/bfcb74df6ba4bd08a501593eb4da5cfa.wasm.br.part2"
    ];

    const config = {
        dataUrl: buildUrl + "/154a6d654bb7b874851fc229ea03288b.data.br",
        frameworkUrl: buildUrl + "/24be5287a2ac010d7044d719825a6b47.framework.js",
        codeUrl: "",
        streamingAssetsUrl: "https://quantil.jsdelivr.net/gh/okyesgoogl/why@main/StreamingAssets",
        companyName: "DefaultCompany",
        productName: "GeometryWaves",
        productVersion: "3.0"
    };

    const container = document.querySelector("#unity-container");
    const canvas = document.querySelector("#unity-canvas");
    const loadingCover = document.querySelector("#loading-cover");
    const progressBarEmpty = document.querySelector("#unity-progress-bar-empty");
    const progressBarFull = document.querySelector("#unity-progress-bar-full");
    const spinner = document.querySelector('.spinner');

    async function loadAndMergeWasm() {
        try {
            const partsData = await Promise.all(wasmParts.map(url =>
                fetch(url).then(r => {
                    if (!r.ok) throw new Error(`Fetch failed: ${url} (${r.status})`);
                    return r.arrayBuffer();
                })
            ));

            const totalLength = partsData.reduce((sum, part) => sum + part.byteLength, 0);
            const mergedArray = new Uint8Array(totalLength);
            let offset = 0;
            for (const part of partsData) {
                mergedArray.set(new Uint8Array(part), offset);
                offset += part.byteLength;
            }

            const wasmBlob = new Blob([mergedArray.buffer], { type: "application/octet-stream" });
            if (config.codeUrl) URL.revokeObjectURL(config.codeUrl);
            config.codeUrl = URL.createObjectURL(wasmBlob);
            console.log("WASM parts merged; blob URL:", config.codeUrl);
        } catch (err) {
            console.error("WASM merge error:", err);
            throw err;
        }
    }

        const canFullscreen = (function () {
            for (const key of [
                'exitFullscreen',
                'webkitExitFullscreen',
                'webkitCancelFullScreen',
                'mozCancelFullScreen',
                'msExitFullscreen',
            ]) {
                if (key in document) {
                    return true;
                }
            }
            return false;
        }());

        if (/iPhone|iPad|iPod|Android/i.test(navigator.userAgent)) {
            container.className = "unity-mobile";

        }

        loadingCover.style.background = "#000";

        loadingCover.style.display = "";

        document.addEventListener('contextmenu', event => event.preventDefault());

        function FocusGame() {
            window.focus();
            canvas.focus();
        }

        window.addEventListener('pointerdown', FocusGame);
        window.addEventListener('touchstart', FocusGame);

        let StartUnityInstance;
        let myGameInstance;
        let ysdk = null;

        let environmentData = {
            language: "en",
            domain: "default_domain",
            deviceType: "desktop",
            isMobile: false,
            isDesktop: true,
            isTablet: false,
            isTV: false,
            appID: "default_app_id",
            browserLang: navigator.language || "en",
            payload: null,
            promptCanShow: false,
            reviewCanShow: false,
            platform: navigator.platform,
            browser: (function() {
                let userAgent = navigator.userAgent;
                if (userAgent.includes("YaBrowser")) return "Yandex";
                if (userAgent.includes("OPR") || userAgent.includes("Opera")) return "Opera";
                if (userAgent.includes("Firefox")) return "Firefox";
                if (userAgent.includes("MSIE") || userAgent.includes("Trident")) return "IE";
                if (userAgent.includes("Edge")) return "Edge";
                if (userAgent.includes("Chrome")) return "Chrome";
                if (userAgent.includes("Safari")) return "Safari";
                return "Other";
            })()
        };

        let cloudSaves = 'noData';
        let paymentsData = 'none';
        let playerData = 'noData';
        let player = null;
        let payments = null;
        let initGame = false;
        let nowFullAdOpen = false;

        function GetPayments() { console.warn("GetPayments is not implemented"); return Promise.resolve("none"); }
        function SaveCloud() { console.warn("SaveCloud is not implemented"); }
        function LoadCloud() { console.warn("LoadCloud is not implemented"); return Promise.resolve("noData"); }
        function InitPlayer() { console.warn("InitPlayer is not implemented"); return Promise.resolve("noData"); }

        function FullAdShow() {
    try {
        if (!nowFullAdOpen) {
            nowFullAdOpen = true;

            if (initGame) {
                myGameInstance.SendMessage("YandexGame", "OpenFullAd");
            }

            setTimeout(() => {
                nowFullAdOpen = false;
                if (initGame) {
                    myGameInstance.SendMessage("YandexGame", "CloseFullAd", "true");
                }
                FocusGame();
            }, 500);
        }
    } catch (error) {
    }
}

function RewardedShow(rewardId) {
    try {
        myGameInstance.SendMessage("YandexGame", "RewardVideo", rewardId);

        function closeRewardedAd() {
            myGameInstance.SendMessage("YandexGame", "CloseRewardVideo");
            FocusGame();
        }
        closeRewardedAd();
    } catch (error) {
    }
}

        function StickyAdActivity() { console.warn("StickyAdActivity is not implemented"); }
        function Review() { console.warn("Review is not implemented"); }
        function PromptShow() { console.warn("PromptShow is not implemented"); }
        function InitLeaderboards() { console.warn("InitLeaderboards is not implemented"); }
        function GetLeaderboardScores() { console.warn("GetLeaderboardScores is not implemented"); }
        function SetLeaderboardScores() { console.warn("SetLeaderboardScores is not implemented"); }
        function ConsumePurchase() { console.warn("ConsumePurchase is not implemented"); }
        function ConsumePurchases() { console.warn("ConsumePurchases is not implemented"); }

    loadAndMergeWasm().then(() => {
        const script = document.createElement("script");
        script.src = loaderUrl;
        script.onload = () => {
            StartUnityInstance = function () {
                createUnityInstance(canvas, config, (progress) => {
                    if (spinner) spinner.style.display = "none";
                    if (progressBarEmpty) progressBarEmpty.style.display = "";
                    if (progressBarFull) progressBarFull.style.width = `${100 * progress}%`;
                }).then((unityInstance) => {
                    myGameInstance = unityInstance;
                    if (loadingCover) loadingCover.style.display = "none";
                }).catch((message) => {
                    console.error("Unity load error:", message);
                });
            };
            StartUnityInstance();
        };
        script.onerror = (e) => {
            console.error("loader.js failed:", e);
        };
        document.body.appendChild(script);
    }).catch(err => {
        console.error("WASM load/merge failed:", err);
        if (spinner) spinner.style.display = "none";
    });

        function InitGame() {
            try {
                console.log('Init Game Success');
                initGame = true;
                if (nowFullAdOpen === true && myGameInstance != null) {
                    myGameInstance.SendMessage('YandexGame', 'OpenFullAd');
                }
            } catch (error) {
                console.error("InitGame error:", error);
            }
        }

        window.addEventListener("unhandledrejection", function(event) {
            console.warn("Ignored error:", event.reason);
            event.preventDefault();
        });
    </script>
