<!DOCTYPE html>

<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Tower Defense</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{height:100%;background:#141a24;font-family:'Segoe UI',system-ui,sans-serif;
    display:flex;align-items:center;justify-content:center;overflow:hidden;touch-action:manipulation}
  #app{width:100%;max-width:640px;display:flex;flex-direction:column;gap:6px;padding:6px}
  #hud{display:flex;justify-content:space-between;align-items:center;background:#1f2a3a;
    border-radius:8px;padding:7px 12px;color:#fff;font-size:14px;font-weight:700}
  #hud .btns button{margin-left:5px;border:none;border-radius:6px;padding:4px 9px;font-weight:700;
    cursor:pointer;font-size:12px}
  #t-cannon{background:#ffd479}#t-frost{background:#7ec8ff}#t-arrow{background:#7dff9b}
  button.sel{outline:3px solid #fff}
  #wrap{position:relative}
  canvas{width:100%;display:block;background:#243447;border-radius:8px}
  #overlay{position:absolute;inset:0;display:flex;flex-direction:column;gap:12px;
    align-items:center;justify-content:center;color:#fff;text-align:center;
    background:rgba(0,0,0,.7);border-radius:8px}
  #overlay h1{font-size:clamp(22px,6vw,34px)}
  #overlay p{font-size:14px;color:#aaa;max-width:82%}
  #start{padding:10px 34px;font-size:17px;font-weight:700;background:#3281ff;color:#fff;
    border:none;border-radius:8px;cursor:pointer}
</style>
</head>
<body>
<div id="app">
  <div id="hud">
    <span>💰 <span id="gold">120</span></span>
    <span>❤️ <span id="lives">10</span></span>
    <span>🌊 Wave <span id="wave">0</span>/20</span>
    <span class="btns">
      <button id="t-arrow" class="sel">🏹 40</button>
      <button id="t-cannon">💣 70</button>
      <button id="t-frost">❄️ 55</button>
      <button id="go">▶ Wave</button>
    </span>
  </div>
  <div id="wrap">
    <canvas id="cv"></canvas>
    <div id="overlay">
      <h1>TOWER DEFENSE</h1>
      <p>Pick a tower (arrow / cannon / frost), tap a grass tile to build,
         then press ▶ Wave. 20 waves — don't let creeps reach your base!</p>
      <button id="start">PLAY</button>
    </div>
  </div>
</div>
<script>
(function(){
  var cv=document.getElementById('cv'),ctx=cv.getContext('2d');
  var overlay=document.getElementById('overlay');
  var COLS=12,ROWS=9,T;
  var PATH=[[0,4],[2,4],[2,1],[5,1],[5,6],[8,6],[8,3],[10,3],[10,7],[12,7]];
  var gold,lives,wave,waveActive,creeps,towers,projectiles,selType='arrow',over;
  var TYPES={
    arrow:{cost:40,range:2.6,dmg:14,rate:600,color:'#7dff9b'},
    cannon:{cost:70,range:2.2,dmg:38,rate:1300,color:'#ffd479'},
    frost:{cost:55,range:2.4,dmg:6,rate:800,color:'#7ec8ff',slow:0.5}
  };

  function size(){var w=cv.getBoundingClientRect().width;
    cv.width=Math.round(w*devicePixelRatio/12)*12;
    T=cv.width/COLS;cv.height=T*ROWS;}
  window.addEventListener('resize',size);size();

  function pathPix(){
    var pts=PATH.map(function(p){return {x:(p[0]+0.5)*T,y:(p[1]+0.5)*T};});
    // densify into waypoints with cumulative length
    var out=[],total=0;
    for(var i=0;i<pts.length-1;i++){
      var a=pts[i],b=pts[i+1],d=Math.hypot(b.x-a.x,b.y-a.y),steps=Math.ceil(d/(T/3));
      for(var s=0;s<steps;s++)out.push({x:a.x+(b.x-a.x)*s/steps,y:a.y+(b.y-a.y)*s/steps});
      total+=d;
    }
    out.push(pts[pts.length-1]);
    return {pts:out,total:total};
  }
  var path;

  function reset(){
    gold=120;lives=10;wave=0;waveActive=false;creeps=[];towers=[];projectiles=[];over=false;
    path=pathPix();
  }

  function onPath(c,r){
    for(var i=0;i<PATH.length-1;i++){
      var a=PATH[i],b=PATH[i+1];
      var x1=Math.min(a[0],b[0]),x2=Math.max(a[0],b[0]);
      var y1=Math.min(a[1],b[1]),y2=Math.max(a[1],b[1]);
      if(c>=x1-0.05&&c<=x2+0.05&&r>=y1-0.05&&r<=y2+0.05)return true;
    }
    return false;
  }

  function spawnWave(){
    wave++;document.getElementById('wave').textContent=wave;
    var n=5+wave*2,hp=40+wave*wave*4,spd=(60+wave*4)*(T/60);
    var types=['normal','normal','fast','tank'];
    for(var i=0;i<n;i++){
      var kind=wave<4?'normal':types[Math.floor(Math.random()*Math.min(types.length,1+Math.floor(wave/4)))];
      var h=hp*(kind==='tank'?2.2:kind==='fast'?0.7:1);
      var v=spd*(kind==='fast'?1.6:kind==='tank'?0.65:1);
      creeps.push({pi:0,hp:h,maxHp:h,spd:v,x:path.pts[0].x,y:path.pts[0].y,slow:0,
        color:kind==='tank'?'#c39bff':kind==='fast'?'#ff9b4d':'#ff5d5d',
        r:T*(kind==='tank'?0.42:0.3),reward:8+wave});
    }
  }

  function update(dt){
    // creeps
    for(var i=creeps.length-1;i>=0;i--){
      var c=creeps[i],s=c.spd*(c.slow>0?0.5:1);
      if(c.slow>0)c.slow-=dt;
      var target=path.pts[Math.min(c.pi+1,path.pts.length-1)];
      var d=Math.hypot(target.x-c.x,target.y-c.y),step=s*dt;
      if(d<=step){c.x=target.x;c.y=target.y;c.pi++;
        if(c.pi>=path.pts.length-1){creeps.splice(i,1);lives--;
          document.getElementById('lives').textContent=lives;
          if(lives<=0){over=true;waveActive=false;showEnd(false);}continue;}
      }else{c.x+=(target.x-c.x)/d*step;c.y+=(target.y-c.y)/d*step;}
    }
    // towers shoot
    for(var t=0;t<towers.length;t++){
      var tw=towers[t];tw.cd-=dt*1000;
      if(tw.cd>0)continue;
      var best=null,bd=1e9;
      for(var j=0;j<creeps.length;j++){
        var cr=creeps[j],d=Math.hypot(cr.x-tw.x,cr.y-tw.y);
        if(d<TYPES[tw.type].range*T&&d<bd){bd=d;best=cr;}
      }
      if(best){
        tw.cd=TYPES[tw.type].rate;
        projectiles.push({x:tw.x,y:tw.y,tgt:best,dmg:TYPES[tw.type].dmg,
          slow:TYPES[tw.type].slow?0.9:0,spd:6*T,color:tw.color});
      }
    }
    // projectiles
    for(var p=projectiles.length-1;p>=0;p--){
      var pr=projectiles[p];
      if(pr.tgt.hp<=0){projectiles.splice(p,1);continue;}
      var d=Math.hypot(pr.tgt.x-pr.x,pr.tgt.y-pr.y),step=pr.spd*dt;
      if(d<=step){
        pr.tgt.hp-=pr.dmg;if(pr.slow)pr.tgt.slow=Math.max(pr.tgt.slow,pr.slow*1000);
        if(pr.tgt.hp<=0){gold+=pr.tgt.reward;
          document.getElementById('gold').textContent=gold;
          creeps.splice(creeps.indexOf(pr.tgt),1);}
        projectiles.splice(p,1);
      }else{pr.x+=(pr.tgt.x-pr.x)/d*step;pr.y+=(pr.tgt.y-pr.y)/d*step;}
    }
    // wave clear
    if(waveActive&&creeps.length===0){
      waveActive=false;gold+=20+wave*5;
      document.getElementById('gold').textContent=gold;
      if(wave>=20){over=true;showEnd(true);}
    }
  }

  function draw(){
    var W=cv.width,H=cv.height;
    ctx.fillStyle='#243447';ctx.fillRect(0,0,W,H);
    // grid grass
    for(var r=0;r<ROWS;r++)for(var c=0;c<COLS;c++){
      if((r+c)%2===0){ctx.fillStyle='rgba(255,255,255,0.02)';
        ctx.fillRect(c*T,r*T,T,T);}
    }
    // path
    ctx.strokeStyle='#5a4a3a';ctx.lineWidth=T*0.8;ctx.lineCap='round';ctx.lineJoin='round';
    ctx.beginPath();
    path.pts.forEach(function(p,i){i?ctx.lineTo(p.x,p.y):ctx.moveTo(p.x,p.y);});
    ctx.stroke();
    // base
    ctx.fillStyle='#3281ff';ctx.beginPath();
    ctx.arc(path.pts[path.pts.length-1].x,path.pts[path.pts.length-1].y,T*0.4,0,7);ctx.fill();
    // towers
    towers.forEach(function(tw){
      var t=TYPES[tw.type];
      ctx.strokeStyle=t.color+'44';ctx.lineWidth=2;
      ctx.beginPath();ctx.arc(tw.x,tw.y,t.range*T,0,7);ctx.stroke();
      ctx.fillStyle=t.color;
      ctx.beginPath();ctx.arc(tw.x,tw.y,T*0.32,0,7);ctx.fill();
      ctx.fillStyle='#141a24';ctx.beginPath();ctx.arc(tw.x,tw.y,T*0.14,0,7);ctx.fill();
    });
    // creeps
    creeps.forEach(function(c){
      ctx.fillStyle=c.color;
      ctx.beginPath();ctx.arc(c.x,c.y,c.r,0,7);ctx.fill();
      ctx.fillStyle='#00000088';
      ctx.fillRect(c.x-c.r,c.y-c.r-6,c.r*2,4);
      ctx.fillStyle='#7dff9b';
      ctx.fillRect(c.x-c.r,c.y-c.r-6,c.r*2*Math.max(0,c.hp/c.maxHp),4);
    });
    // projectiles
    ctx.fillStyle='#fff';
    projectiles.forEach(function(p){
      ctx.beginPath();ctx.arc(p.x,p.y,T*0.09,0,7);ctx.fill();});
  }

  var last=0,running=false;
  function loop(t){
    var dt=Math.min((t-last)/1000,0.05);last=t;
    if(running&&!over)update(dt);
    if(path)draw();
    requestAnimationFrame(loop);
  }

  function showEnd(won){
    running=false;
    overlay.style.display='flex';
    overlay.querySelector('h1').textContent=won?'🏆 VICTORY!':'💀 DEFEAT';
    overlay.querySelector('p').innerHTML=
      (won?'All 20 waves cleared!':'Reached wave '+wave+'.')+' Gold earned: '+gold;
    document.getElementById('start').textContent='PLAY AGAIN';
  }

  cv.addEventListener('pointerdown',function(e){
    if(!running)return;
    var r=cv.getBoundingClientRect();
    var x=(e.clientX-r.left)*(cv.width/r.width),y=(e.clientY-r.top)*(cv.height/r.height);
    var c=Math.floor(x/T),rr=Math.floor(y/T);
    if(c<0||c>=COLS||rr<0||rr>=ROWS||onPath(c,rr))return;
    for(var i=0;i<towers.length;i++)
      if(towers[i].c===c&&towers[i].r===rr)return;
    var t=TYPES[selType];
    if(gold<t.cost)return;
    gold-=t.cost;document.getElementById('gold').textContent=gold;
    towers.push({type:selType,c:c,r:rr,x:(c+0.5)*T,y:(rr+0.5)*T,cd:0});
  });

  [['arrow','t-arrow'],['cannon','t-cannon'],['frost','t-frost']].forEach(function(p){
    document.getElementById(p[1]).addEventListener('click',function(){
      selType=p[0];
      document.querySelectorAll('#hud .btns button:not(#go)').forEach(function(b){
        b.classList.remove('sel');});
      this.classList.add('sel');
    });
  });

  document.getElementById('go').addEventListener('click',function(){
    if(running&&!waveActive&&creeps.length===0&&!over){waveActive=true;spawnWave();}
  });

  document.getElementById('start').addEventListener('click',function(){
    overlay.style.display='none';
    document.getElementById('gold').textContent=gold=120;
    document.getElementById('lives').textContent=lives=10;
    document.getElementById('wave').textContent=wave=0;
    reset();running=true;
  });

  reset();loop(0);
})();
</script>
<div class="qhub-watermark" aria-hidden="true">◈ QUANTUM</div><style>.qhub-watermark{position:fixed;right:10px;bottom:10px;z-index:2147483647;font:700 11px monospace;letter-spacing:2px;color:#39ff14;background:rgba(0,0,0,.55);border:1px solid rgba(57,255,20,.5);border-radius:6px;padding:4px 8px;pointer-events:none;user-select:none;opacity:.85}</style></body>
</html>
